<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Smugglers Town 3D — World Tour</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #111a26;
      --panel2: #172334;
      --sand: #fbbf24;
      --accent: #ff5500;
      --hot: #ff2a5f;
      --cool: #38bdf8;
      --good: #10b981;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --line: #223247;

      /* surfaces, mixed from the palette rather than picked by hand */
      --scrim: rgb(11 15 23 / .95);
      --field-bg: rgb(7 11 18 / .65);
      --inset-bg: rgb(0 0 0 / .35);

      /* spacing scale: every gap, pad and margin comes from here */
      --space-2xs: 4px;
      --space-xs: 6px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --space-2xl: 32px;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 14px;
      --border: 2px;

      /* type scale */
      --text-2xs: 9px;
      --text-xs: 10px;
      --text-sm: 11px;
      --text-md: 13px;
      --text-lg: 15px;
      --tracking-wide: .14em;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #wrap { position: fixed; inset: 0; }

    /* the corners were named in main.ts from the first commit but never styled,
       so the whole HUD stacked in normal flow underneath the canvas */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #hud[hidden] { display: none; }
    .hud-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      /* keep clear of notches and home indicators */
      --edge-x: max(var(--space-lg), env(safe-area-inset-left));
      --edge-r: max(var(--space-lg), env(safe-area-inset-right));
      --edge-t: max(var(--space-lg), env(safe-area-inset-top));
      --edge-b: max(var(--space-lg), env(safe-area-inset-bottom));
    }
    .hud-tl { top: var(--edge-t); left: var(--edge-x); width: min(15rem, 40vw); }
    .hud-tr { top: var(--edge-t); right: var(--edge-r); align-items: flex-end; }
    .hud-bl { bottom: var(--edge-b); left: var(--edge-x); }
    .hud-br { bottom: var(--edge-b); right: var(--edge-r); align-items: flex-end; }

    /* phones and short landscape windows: the HUD shrinks rather than overlaps */
    @media (max-width: 40rem), (max-height: 30rem) {
      .hud-corner { gap: var(--space-xs); --edge-x: max(var(--space-sm), env(safe-area-inset-left));
        --edge-r: max(var(--space-sm), env(safe-area-inset-right));
        --edge-t: max(var(--space-sm), env(safe-area-inset-top));
        --edge-b: max(var(--space-sm), env(safe-area-inset-bottom)); }
      .hud-tl { width: min(11rem, 42vw); }
    }
    canvas { display: block; width: 100%; height: 100%; }
    .display { font-family: 'Russo One', sans-serif; letter-spacing: .01em; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .hud-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(17, 26, 38, 0.88);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      user-select: none;
      width: fit-content;
    }
    .hud-btn[hidden] { display: none; }
    .hud-btn:hover {
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 85, 0, 0.25);
      transform: translateY(-1px);
    }
    .hud-btn:active {
      transform: translateY(1px);
    }
    .hud-btn.active {
      background: rgba(20, 36, 56, 0.92);
      border-color: var(--cool);
      color: var(--cool);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
