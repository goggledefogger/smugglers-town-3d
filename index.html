<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Smugglers Town 3D — Turf Wars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1410;
      --panel: #241c16;
      --panel2: #2e251c;
      --sand: #c89b5a;
      --accent: #ff5a1f;
      --hot: #ff2d55;
      --cool: #4fc3f7;
      --good: #7dd87d;
      --ink: #f4ead8;
      --muted: #a8957c;
      --line: #3a2f24;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #wrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .display { font-family: 'Russo One', sans-serif; letter-spacing: .01em; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
